[package]
name = "standing-order"
description = "Recurring payroll and scheduled payouts for Sputnik DAO treasuries on NEAR"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/unajijacob6-create/standing-order"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = "0.24"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
bs58 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
# Drop the `name` custom section so every machine produces the same ~410 KB artifact.
strip = true
